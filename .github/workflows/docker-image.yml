name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  publish_image:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: Build backend
        run: docker build -f HospitalSystem/Dockerfile -t kstkaan/githubactions:backend-latest .

      - name: push to docker hub
        run: docker push kstkaan/githubactions:latest

      - name: Build frontend
        run: docker build -t kstkaan/githubactions:frontend-latest ./hospital-frontend

      - name: push to docker hub
        run: docker push kstkaan/githubactions:latest