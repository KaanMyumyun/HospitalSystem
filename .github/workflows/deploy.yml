name: Deploy to EKS

on:
  workflow_run:
    workflows: ["Docker Image CI"]
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'workflow_run' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: ${{ vars.AWS_REGION || secrets.AWS_REGION }}
      AWS_DEPLOY_ROLE_TO_ASSUME: ${{ vars.AWS_DEPLOY_ROLE_TO_ASSUME || secrets.AWS_DEPLOY_ROLE_TO_ASSUME }}
      DEPLOY_SSM_DOCUMENT: ${{ vars.DEPLOY_SSM_DOCUMENT }}
      DEPLOY_INSTANCE_NAME: ${{ vars.DEPLOY_INSTANCE_NAME }}

    steps:
      - name: Validate deploy configuration
        run: |
          if [ -z "$AWS_REGION" ]; then
            echo "AWS_REGION repository variable or secret is required."
            exit 1
          fi

          if [ -z "$AWS_DEPLOY_ROLE_TO_ASSUME" ]; then
            echo "AWS_DEPLOY_ROLE_TO_ASSUME repository variable or secret is required."
            echo "Set it to the github_actions_deploy_role_arn Terraform output."
            exit 1
          fi

          if [ -z "$DEPLOY_SSM_DOCUMENT" ] || [ -z "$DEPLOY_INSTANCE_NAME" ]; then
            echo "DEPLOY_SSM_DOCUMENT and DEPLOY_INSTANCE_NAME repository variables are required."
            echo "Set them to the deploy_ssm_document_name and ops_instance_name Terraform outputs."
            exit 1
          fi

      - name: Set deployment image tag
        run: |
          HEAD_SHA="${{ github.event.workflow_run.head_sha }}"
          echo "IMAGE_TAG=$(date -u +'%Y-%m-%d')-${HEAD_SHA:0:7}" >> "$GITHUB_ENV"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      # The EKS API endpoint is private. The deploy runs on the ops instance
      # inside the VPC, through an SSM document whose only input is the tag.
      - name: Find the ops instance
        run: |
          INSTANCE_IDS=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=${DEPLOY_INSTANCE_NAME}" "Name=instance-state-name,Values=running" \
            --query 'Reservations[].Instances[].InstanceId' \
            --output text)

          COUNT=$(wc -w <<< "$INSTANCE_IDS")
          if [ "$COUNT" -ne 1 ]; then
            echo "Expected one running instance named ${DEPLOY_INSTANCE_NAME}, found ${COUNT}."
            exit 1
          fi

          echo "INSTANCE_ID=${INSTANCE_IDS}" >> "$GITHUB_ENV"

      - name: Deploy through SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --document-name "$DEPLOY_SSM_DOCUMENT" \
            --instance-ids "$INSTANCE_ID" \
            --parameters "ImageTag=${IMAGE_TAG}" \
            --comment "Deploy ${IMAGE_TAG}" \
            --query Command.CommandId \
            --output text)
          echo "SSM command ${COMMAND_ID} on ${INSTANCE_ID}"

          # The document times out after 600 seconds; poll a little longer.
          for _ in $(seq 1 70); do
            STATUS=$(aws ssm list-commands \
              --command-id "$COMMAND_ID" \
              --query 'Commands[0].Status' \
              --output text)
            case "$STATUS" in
              Pending | InProgress | Delayed) sleep 10 ;;
              *) break ;;
            esac
          done

          aws ssm list-command-invocations \
            --command-id "$COMMAND_ID" \
            --details \
            --query 'CommandInvocations[0].CommandPlugins[0].Output' \
            --output text

          if [ "$STATUS" != "Success" ]; then
            echo "Deploy command ended with status ${STATUS}."
            exit 1
          fi
