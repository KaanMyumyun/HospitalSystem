name: Docker Image CI

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

permissions: {}

concurrency:
  group: docker-image-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  docker:
    if: ${{ github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'schedule') && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: ${{ vars.AWS_REGION || secrets.AWS_REGION }}
      ECR_REGISTRY: ${{ vars.ECR_REGISTRY || secrets.ECR_REGISTRY }}
      BACKEND_IMAGE: ${{ vars.ECR_BACKEND_REPOSITORY || secrets.ECR_BACKEND_REPOSITORY }}
      FRONTEND_IMAGE: ${{ vars.ECR_FRONTEND_REPOSITORY || secrets.ECR_FRONTEND_REPOSITORY }}

    steps:
      - name: Checkout exact upstream commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      # Unique per build: the weekly rebuild of an unchanged commit gets a new
      # tag instead of overwriting the image already pushed for that commit.
      - name: Set image tag
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          echo "IMAGE_TAG=$(date -u +'%Y-%m-%d')-${HEAD_SHA:0:7}-${RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Login to Docker Hub
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: printf '%s' "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Both builds load the image into the local Docker engine instead of
      # pushing it, so the image that is scanned is the one that is pushed.
      # The weekly run skips the cache so the apk upgrade layers pick up
      # Alpine security fixes; it still refreshes the cache for later builds.
      - name: Build backend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: HospitalSystem/Dockerfile
          pull: true
          no-cache: ${{ github.event.workflow_run.event == 'schedule' }}
          load: true
          tags: |
            kstkaan/hospital-backend:latest
            kstkaan/hospital-backend:${{ env.IMAGE_TAG }}
            ${{ env.ECR_REGISTRY }}/${{ env.BACKEND_IMAGE }}:latest
            ${{ env.ECR_REGISTRY }}/${{ env.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: hospital-frontend
          file: hospital-frontend/Dockerfile
          pull: true
          no-cache: ${{ github.event.workflow_run.event == 'schedule' }}
          load: true
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL || secrets.VITE_API_URL || vars.AWS_API_URL || secrets.AWS_API_URL }}
          tags: |
            kstkaan/hospital-frontend:latest
            kstkaan/hospital-frontend:${{ env.IMAGE_TAG }}
            ${{ env.ECR_REGISTRY }}/${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.ECR_REGISTRY }}/${{ env.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Scan backend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.ECR_REGISTRY }}/${{ env.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.ECR_REGISTRY }}/${{ env.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1
          skip-setup-trivy: true

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME || secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Push images
        run: |
          docker push --all-tags kstkaan/hospital-backend
          docker push --all-tags "${ECR_REGISTRY}/${BACKEND_IMAGE}"
          docker push --all-tags kstkaan/hospital-frontend
          docker push --all-tags "${ECR_REGISTRY}/${FRONTEND_IMAGE}"

      # Deploy to EKS reads the tag from here instead of working it out again.
      - name: Record the pushed tag
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          mkdir release
          printf '%s\n' "$IMAGE_TAG" > release/image-tag
          printf '%s\n' "$HEAD_SHA" > release/commit-sha

      - name: Upload the release record
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: release/
          if-no-files-found: error
