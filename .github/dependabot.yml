version: 2
updates:
  # Keeps the commit SHAs that the workflows pin actions to (and the version
  # comments next to them) current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Skip releases younger than a week. Hijacked releases, like the Trivy
    # action's in March 2026, are usually caught and pulled within days.
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
