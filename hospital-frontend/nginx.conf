server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers for every response. A location that sets its own
    # add_header would drop these without add_header_inherit (nginx 1.29.3+).
    # public/_headers sets the same ones for Cloudflare Pages.
    add_header_inherit merge;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Vite fingerprints these files, so a new build gets new asset URLs.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Also applies to the 404 responses below, whose body is the app shell.
    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    # The app has a single page, so any other path is a real 404, robots.txt,
    # sitemap.xml and favicon.ico included. The body is still the app shell,
    # so a browser shows the app's own not-found screen. `$uri/` lets `/`
    # reach the index directive; without it the homepage is a 404 too.
    location / {
        try_files $uri $uri/ =404;
        error_page 404 /index.html;
    }
}
