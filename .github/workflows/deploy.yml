name: Deploy to EKS

on:
  workflow_run:
    workflows: ["Docker Image CI"]
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'workflow_run' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    # Waits for a required reviewer to approve. The EKS deploy role trusts this
    # environment's OIDC subject, so this line is also what lets the job into AWS.
    environment: production
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: ${{ vars.AWS_REGION || secrets.AWS_REGION }}
      AWS_DEPLOY_ROLE_TO_ASSUME: ${{ vars.AWS_DEPLOY_ROLE_TO_ASSUME || secrets.AWS_DEPLOY_ROLE_TO_ASSUME }}
      ECR_REGISTRY: ${{ vars.ECR_REGISTRY || secrets.ECR_REGISTRY }}
      BACKEND_IMAGE: ${{ vars.ECR_BACKEND_REPOSITORY || secrets.ECR_BACKEND_REPOSITORY }}
      FRONTEND_IMAGE: ${{ vars.ECR_FRONTEND_REPOSITORY || secrets.ECR_FRONTEND_REPOSITORY }}
      EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}
      K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE }}

    steps:
      - name: Validate deploy configuration
        run: |
          if [ -z "$AWS_REGION" ]; then
            echo "AWS_REGION repository variable or secret is required."
            exit 1
          fi

          if [ -z "$AWS_DEPLOY_ROLE_TO_ASSUME" ]; then
            echo "AWS_DEPLOY_ROLE_TO_ASSUME repository variable or secret is required."
            echo "Set it to the github_actions_deploy_role_arn Terraform output."
            exit 1
          fi

          if [ -z "$ECR_REGISTRY" ] || [ -z "$BACKEND_IMAGE" ] || [ -z "$FRONTEND_IMAGE" ]; then
            echo "ECR_REGISTRY, ECR_BACKEND_REPOSITORY, and ECR_FRONTEND_REPOSITORY repository variables or secrets are required."
            exit 1
          fi

          if [ -z "$EKS_CLUSTER_NAME" ] || [ -z "$K8S_NAMESPACE" ]; then
            echo "EKS_CLUSTER_NAME and K8S_NAMESPACE repository variables are required."
            echo "Set them to the cluster_name Terraform output and the k8s_namespace Ansible variable."
            exit 1
          fi

      - name: Set deployment image tag
        run: |
          HEAD_SHA="${{ github.event.workflow_run.head_sha }}"
          echo "IMAGE_TAG=$(date -u +'%Y-%m-%d')-${HEAD_SHA:0:7}" >> "$GITHUB_ENV"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER_NAME"

      - name: Verify Kubernetes deploy permissions
        run: |
          kubectl auth can-i patch deployments -n "$K8S_NAMESPACE"

      - name: Update EKS deployment images
        run: |
          kubectl set image deployment/hospital-backend \
            backend="${ECR_REGISTRY}/${BACKEND_IMAGE}:${IMAGE_TAG}" \
            -n "$K8S_NAMESPACE"

          kubectl set image deployment/hospital-frontend \
            frontend="${ECR_REGISTRY}/${FRONTEND_IMAGE}:${IMAGE_TAG}" \
            -n "$K8S_NAMESPACE"

      - name: Check deployment scale
        id: scale
        run: |
          BACKEND_REPLICAS=$(kubectl get deployment hospital-backend \
            -n "$K8S_NAMESPACE" \
            -o jsonpath='{.spec.replicas}')

          FRONTEND_REPLICAS=$(kubectl get deployment hospital-frontend \
            -n "$K8S_NAMESPACE" \
            -o jsonpath='{.spec.replicas}')

          echo "backend_replicas=${BACKEND_REPLICAS:-0}" >> "$GITHUB_OUTPUT"
          echo "frontend_replicas=${FRONTEND_REPLICAS:-0}" >> "$GITHUB_OUTPUT"

      - name: Wait for EKS rollouts
        if: ${{ steps.scale.outputs.backend_replicas != '0' || steps.scale.outputs.frontend_replicas != '0' }}
        run: |
          kubectl rollout status deployment/hospital-backend -n "$K8S_NAMESPACE" --timeout=180s
          kubectl rollout status deployment/hospital-frontend -n "$K8S_NAMESPACE" --timeout=180s

      - name: Skip deployment because app is scaled down
        if: ${{ steps.scale.outputs.backend_replicas == '0' && steps.scale.outputs.frontend_replicas == '0' }}
        run: |
          echo "Backend and frontend deployments are scaled to 0."
          echo "Deployment image tags were updated to ${IMAGE_TAG}; the next manual scale-up will run that exact image."
