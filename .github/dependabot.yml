version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: nuget
    directories:
      - /HospitalSystem
      - /MyApp.Tests
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # Swashbuckle is built against Microsoft.OpenApi 2.x. With 3.x the API
      # still builds, but generating the Swagger document fails at run time.
      - dependency-name: "Microsoft.OpenApi"
        update-types: ["version-update:semver-major"]
    groups:
      nuget:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /hospital-frontend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm:
        patterns:
          - "*"

  - package-ecosystem: docker
    directories:
      - /HospitalSystem
      - /hospital-frontend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      docker:
        patterns:
          - "*"
